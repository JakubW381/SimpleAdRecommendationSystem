services:

  #   ----- PROMETHEUS -----
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #   ----- GRAFANA -----
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  #   ----- JAEGER -----
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ad-jaeger
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app_net

  #   ----- REDIS -----
  ad-redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data

  #    ----- POSTGRES -----

  ad-postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_DB: ad-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data/ad:/var/lib/postgresql/data

  user-postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_DB: user-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres_data/user:/var/lib/postgresql/data

  auth-postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_DB: auth-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres_data/auth:/var/lib/postgresql/data

  #    ----- KAFKA -----

  ad-kafka-broker1:
    image: apache/kafka:latest
    hostname: broker1
    container_name: ad-kafka-broker1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9091,2@broker2:9091,3@broker3:9091
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9090,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks:
      - app_net
    volumes:
      - ./data/kafka/broker1:/var/lib/kafka/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9090 --list" ]
      interval: 10s
      timeout: 10s
      retries: 5

  ad-kafka-broker2:
    image: apache/kafka:latest
    hostname: broker2
    container_name: ad-kafka-broker2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9091,2@broker2:9091,3@broker3:9091
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9090,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks:
      - app_net
    volumes:
      - ./data/kafka/broker2:/var/lib/kafka/data:Z

  ad-kafka-broker3:
    image: apache/kafka:latest
    hostname: broker3
    container_name: ad-kafka-broker3
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9091,2@broker2:9091,3@broker3:9091
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9090,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks:
      - app_net
    volumes:
      - ./data/kafka/broker3:/var/lib/kafka/data:Z

networks:
  app_net:
    driver: bridge