services:
  ad-redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data

  ad-postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_DB: ad-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data