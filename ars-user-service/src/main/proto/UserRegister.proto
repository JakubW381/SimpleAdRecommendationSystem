syntax = "proto3";

package dev.jakubw.grpc;

option java_multiple_files = true;
option java_package = "dev.jakubw.grpc";

import "adTag.proto";

message UserRegisterRpcRequest{
  string username = 1;
  string email = 2;
  repeated RpcAdTag tags = 3;
}
message UserRegisterRpcResponse{
  string id = 1;
}

service UserRegisterService{
  rpc register (UserRegisterRpcRequest) returns (UserRegisterRpcResponse);
}