syntax = "proto3";

package dev.jakubw.grpc;

option java_multiple_files = true;
option java_package = "dev.jakubw.grpc";

message ProviderRegisterRpcRequest{
  string name = 1;
}
message ProviderRegisterRpcResponse{
  string id = 1;
}

service ProviderRegisterService{
  rpc register (ProviderRegisterRpcRequest) returns (ProviderRegisterRpcResponse);
}
