apiVersion: apps/v1
kind: Deployment
metadata:
  name: ars-ad-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ars-ad-service
  template:
    metadata:
      labels:
        app: ars-ad-service
    spec:
      containers:
        - name: ars-ad-service
          image: ars-ad-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9081
          envFrom:
            - secretRef:
                name: ars-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ars-ad-service
  namespace: apps
spec:
  selector:
    app: ars-ad-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9081
      targetPort: 9081