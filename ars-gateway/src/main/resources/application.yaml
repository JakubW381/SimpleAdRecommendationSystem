server:
  port: 8080

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE

services:
  ad-service:
    uri: ${AD_SERVICE_URI:http://localhost:8081}
  user-service:
    uri: ${USER_SERVICE_URI:http://localhost:8082}
  auth-service:
    uri: ${AUTH_SERVICE_URI:http://localhost:8083}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  metrics:
    tags:
      application: gateway
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: ars-gateway
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4317}
          transport: grpc
  otlp:
    metrics:
      export:
        enabled: false
prometheus:
  auth:
    username: ${PROMETHEUS_USERNAME}
    password: ${PROMETHEUS_PASSWORD}

springdoc:
  swagger-ui:
    urls:
      - name: ads
        url: /api/docs/ad/v3/api-docs/ads
      - name: provider
        url: /api/docs/ad/v3/api-docs/provider
      - name: impression
        url: /api/docs/ad/v3/api-docs/impression

      - name: user
        url: /api/docs/user/v3/api-docs/user

      - name: auth
        url: /api/docs/auth/v3/api-docs/auth